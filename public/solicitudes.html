<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solicitudes de cuenta · SIGELAB-INCOS</title>
  <link rel="stylesheet" href="/css/app.css?v=6" />
</head>
<body>
  <header id="topbar"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Solicitudes de cuenta</h1>
        <p class="sub">Revise el rol solicitado y apruebe o rechace las cuentas SIGELAB.</p>
      </div>
      <button class="btn btn-outline" id="btnRecargar" type="button">Actualizar</button>
    </div>

    <div id="alerta"></div>

    <section class="grid grid-3 mb-3" id="resumen"></section>

    <section class="card">
      <div class="page-head" style="margin-bottom: 10px;">
        <h2 style="font-size: 1.1rem; margin: 0;">Pendientes</h2>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Solicitante</th>
              <th>Rol solicitado</th>
              <th>Correo verificado</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="filas-pendientes">
            <tr class="empty"><td colspan="5" style="text-align:center">Cargando solicitudes…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card mt-3">
      <div class="page-head" style="margin-bottom: 10px;">
        <h2 style="font-size: 1.1rem; margin: 0;">Historial</h2>
        <select class="form-select" id="filtroHistorial" style="max-width: 220px;">
          <option value="">Todas</option>
          <option value="APROBADO">Aprobadas</option>
          <option value="RECHAZADO">Rechazadas</option>
        </select>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Solicitante</th>
              <th>Rol asignado</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Motivo / aprobado por</th>
            </tr>
          </thead>
          <tbody id="filas-historial">
            <tr class="empty"><td colspan="5" style="text-align:center">Sin historial aún.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js?v=6"></script>
  <script src="/js/ui.js?v=6"></script>
  <script>
    (function () {
      proteger();
      montarNavegacion('solicitudes');

      let ROLES = [
        { valor: 'CONSULTA', etiqueta: 'Consulta' },
        { valor: 'SERVICIO', etiqueta: 'Técnico de Laboratorio' },
        { valor: 'ADMINISTRATIVO', etiqueta: 'Encargado de Laboratorios' }
      ];
      const POR_ID = new Map();

      function rolEtiqueta(valor) {
        const r = ROLES.find(function (x) { return x.valor === valor; });
        return r ? r.etiqueta : (valor || '—');
      }

      function fecha(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '—';
        try {
          return d.toLocaleString('es-BO', {
            timeZone: 'America/La_Paz',
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
        } catch (e) {
          return String(iso);
        }
      }

      function toast(mensaje, tipo) {
        const el = document.createElement('div');
        el.className = 'alert alert-' + (tipo || 'info');
        el.textContent = mensaje;
        el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:520px;';
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 5000);
      }

      function alerta(mensaje, tipo) {
        mostrarAlerta('#alerta', mensaje, tipo || 'danger');
      }

      function renderResumen(pendientes, aprobadas, rechazadas) {
        document.getElementById('resumen').innerHTML =
          '<div class="stat"><div class="label">Pendientes</div><div class="value">' + pendientes.length + '</div></div>' +
          '<div class="stat ok"><div class="label">Aprobadas</div><div class="value">' + aprobadas.length + '</div></div>' +
          '<div class="stat danger"><div class="label">Rechazadas</div><div class="value">' + rechazadas.length + '</div></div>';
      }

      function renderPendientes(pendientes) {
        const tbody = document.getElementById('filas-pendientes');
        POR_ID.clear();
        if (!pendientes.length) {
          tbody.innerHTML = '<tr class="empty"><td colspan="5" style="text-align:center">No hay solicitudes pendientes.</td></tr>';
          return;
        }
        pendientes.forEach(function (s) { POR_ID.set(Number(s.usuario_id), s); });
        tbody.innerHTML = pendientes.map(function (s) {
          return '<tr>' +
            '<td><strong>' + esc(s.nombre_completo) + '</strong><br><span class="hint">' +
              esc(s.correo) + ' · ' + esc(s.telefono) + '</span></td>' +
            '<td><span class="badge badge-info">' + esc(rolEtiqueta(s.rol_solicitado)) + '</span></td>' +
            '<td>' + (s.correo_verificado
              ? '<span class="badge badge-ok">Sí</span>'
              : '<span class="badge badge-warn">No</span>') + '</td>' +
            '<td>' + esc(fecha(s.solicitud_en)) + '</td>' +
            '<td><div class="actions">' +
              '<button class="btn btn-primary btn-sm" data-accion="aprobar" data-id="' + s.usuario_id + '" data-rol="' + esc(s.rol_solicitado) + '">Aprobar</button>' +
              '<button class="btn btn-outline btn-sm" data-accion="rechazar" data-id="' + s.usuario_id + '">Rechazar</button>' +
            '</div></td>' +
          '</tr>';
        }).join('');
      }

      function renderHistorial(todas) {
        const filtro = document.getElementById('filtroHistorial').value;
        const lista = filtro ? todas.filter(function (s) { return s.estado_solicitud === filtro; }) : todas;
        const tbody = document.getElementById('filas-historial');
        if (!lista.length) {
          tbody.innerHTML = '<tr class="empty"><td colspan="5" style="text-align:center">Sin historial aún.</td></tr>';
          return;
        }
        tbody.innerHTML = lista.map(function (s) {
          const esAprobado = s.estado_solicitud === 'APROBADO';
          const detalle = esAprobado
            ? (s.aprobado_por_nombre ? 'Aprobado por ' + s.aprobado_por_nombre : 'Aprobado')
            : (s.motivo_rechazo ? 'Motivo: ' + s.motivo_rechazo : 'Sin motivo');
          return '<tr>' +
            '<td><strong>' + esc(s.nombre_completo) + '</strong><br><span class="hint">' + esc(s.correo) + '</span></td>' +
            '<td>' + esc(rolEtiqueta(s.rol)) + '</td>' +
            '<td>' + esc(fecha(esAprobado ? s.aprobado_en : s.rechazado_en)) + '</td>' +
            '<td>' + (esAprobado
              ? '<span class="badge badge-ok">APROBADO</span>'
              : '<span class="badge badge-danger">RECHAZADO</span>') + '</td>' +
            '<td><span class="hint">' + esc(detalle) + '</span></td>' +
          '</tr>';
        }).join('');
      }

      async function cargar() {
        try {
          const datos = await API.pedir('/api/auth/solicitudes');
          const solicitudes = (datos && datos.solicitudes) || [];
          const pendientes = solicitudes.filter(function (s) { return s.estado_solicitud === 'PENDIENTE'; });
          const aprobadas = solicitudes.filter(function (s) { return s.estado_solicitud === 'APROBADO'; });
          const rechazadas = solicitudes.filter(function (s) { return s.estado_solicitud === 'RECHAZADO'; });
          renderResumen(pendientes, aprobadas, rechazadas);
          renderPendientes(pendientes);
          renderHistorial(aprobadas.concat(rechazadas));
          limpiarAlerta('#alerta');
        } catch (e) {
          alerta(e.message || 'No fue posible cargar las solicitudes.');
        }
      }

      function abrirAprobar(solicitud) {
        const opciones = ROLES.map(function (r) {
          return '<option value="' + esc(r.valor) + '"' +
            (r.valor === solicitud.rol_solicitado ? ' selected' : '') + '>' +
            esc(r.etiqueta) + '</option>';
        }).join('');

        abrirModal({
          titulo: 'Aprobar solicitud',
          html:
            '<p><strong>' + esc(solicitud.nombre) + '</strong><br>' +
              '<span class="hint">' + esc(solicitud.correo) + ' · ' + esc(solicitud.telefono) + '</span></p>' +
            '<p>Rol solicitado: <strong>' + esc(rolEtiqueta(solicitud.rol_solicitado)) + '</strong></p>' +
            '<div class="field"><label for="rolAprobar">Rol a asignar</label>' +
              '<select class="form-select" id="rolAprobar">' + opciones + '</select>' +
              '<p class="hint">Puede aprobar con el rol solicitado o asignar otro.</p></div>',
          textoConfirmar: 'Aprobar',
          onConfirmar: async function (modal) {
            const rol = modal.querySelector('#rolAprobar').value;
            await API.pedir('/api/auth/solicitudes/' + solicitud.id + '/aprobar', {
              method: 'POST',
              body: { rol: rol }
            });
            toast('Solicitud aprobada con rol ' + rolEtiqueta(rol) + '.', 'ok');
            await cargar();
          }
        });
      }

      function abrirRechazar(solicitud) {
        abrirModal({
          titulo: 'Rechazar solicitud',
          html:
            '<p><strong>' + esc(solicitud.nombre) + '</strong><br>' +
              '<span class="hint">' + esc(solicitud.correo) + ' · ' + esc(solicitud.telefono) + '</span></p>' +
            '<p>Rol solicitado: <strong>' + esc(rolEtiqueta(solicitud.rol_solicitado)) + '</strong></p>' +
            '<div class="field"><label for="motivoRechazo">Motivo (opcional)</label>' +
              '<textarea class="form-control" id="motivoRechazo" maxlength="300" placeholder="Ej. No corresponde al área solicitada."></textarea></div>',
          textoConfirmar: 'Rechazar',
          peligro: true,
          onConfirmar: async function (modal) {
            const motivo = modal.querySelector('#motivoRechazo').value;
            await API.pedir('/api/auth/solicitudes/' + solicitud.id + '/rechazar', {
              method: 'POST',
              body: { motivo: motivo }
            });
            toast('Solicitud rechazada.', 'ok');
            await cargar();
          }
        });
      }

      document.getElementById('filas-pendientes').addEventListener('click', function (ev) {
        const btn = ev.target.closest('button[data-accion]');
        if (!btn) return;
        const id = Number(btn.getAttribute('data-id'));
        const original = POR_ID.get(id) || {};
        const solicitud = {
          id: id,
          nombre: original.nombre_completo || '',
          correo: original.correo || '',
          telefono: original.telefono || '',
          rol_solicitado: original.rol_solicitado || btn.getAttribute('data-rol') || 'CONSULTA'
        };
        if (btn.getAttribute('data-accion') === 'aprobar') abrirAprobar(solicitud);
        else abrirRechazar(solicitud);
      });

      document.getElementById('filtroHistorial').addEventListener('change', cargar);
      document.getElementById('btnRecargar').addEventListener('click', cargar);

      API.pedir('/api/auth/config')
        .then(function (cfg) {
          if (cfg && Array.isArray(cfg.rolesSolicitud) && cfg.rolesSolicitud.length) {
            ROLES = cfg.rolesSolicitud.map(function (r) {
              return { valor: r.valor, etiqueta: r.etiqueta };
            });
          }
        })
        .catch(function () { /* usar roles por defecto */ })
        .finally(cargar);
    })();
  </script>
</body>
</html>
